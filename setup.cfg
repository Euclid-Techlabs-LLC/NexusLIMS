#

[metadata]
name = nexusLIMS
description = The NIST/Euclid Electron Microscopy Nexus LIMS project
author = Euclid Techlabs, NIST ODI
author-email = software@euclidtechlabs.com, AskODI@nist.gov
license = custom
long-description = file: README.rst
long-description-content-type = text/x-rst; charset=UTF-8
url = https://github.com/euclidtechlabs/nexuslims/
project-urls =
    Documentation = https://euclidtechlabs.github.io/nexuslims/
# Change if running only on Windows, Mac or Linux (comma-separated)
platforms = any
# Add here all kinds of additional classifiers as defined under
# https://pypi.python.org/pypi?%3Aaction=list_classifiers
classifiers =
    Development Status :: 3 - Alpha
    Programming Language :: Python

    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering
keywords = electronmicroscopy datamanagement information metadata schema

[options]
zip_safe = False
packages = find:
include_package_data = True
package_dir =
    =src
# Commenting setup_requires out because setup_requires is discouraged by PEP
# 518.
# DON'T CHANGE THE FOLLOWING LINE! IT WILL BE UPDATED BY PYSCAFFOLD!
# setup_requires = pyscaffold>=3.3a0,<4

# Add here dependencies of your project (semicolon/line-separated)
# 03/18/2021, Euclid developers: *temporarily* fix versions for development
# install_requires list should be always consistent with the list in
# *requirements.txt*.
install_requires =
    coverage==5.4
    lxml==4.6.2
    ntlm-auth==1.5.0
    requests==2.25.1
    requests_ntlm==1.1.0
    hyperspy==1.6.1
    numpy==1.20.1
    matplotlib==3.3.4
    ldap3==2.9
    pytz==2021.1
    scikit-image==0.18.1
    scikit-learn==0.24.1
    tendo==0.2.15
# The usage of test_requires is discouraged, see `Dependency Management` docs
# tests_require = pytest; pytest-cov
# Require a specific Python version, e.g. Python 2.7 or >= 3.4
python_requires = >=3.7,<3.9

[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]
# Add here additional requirements for extra features, to install with:
# `pip install nexusLIMS[PDF]` like:
# PDF = ReportLab; RXP
# Add here test requirements (semicolon/line-separated)
testing =
    pytest
    pytest-cov
    sphinx
    sphinx_bootstrap_theme

[options.entry_points]
# Add here console scripts like:
# console_scripts =
#     script_name = nexuslims.module:function
# For example:
# console_scripts =
#     fibonacci = nexuslims.skeleton:run
# And any other entry points, for example:
# pyscaffold.cli =
#     awesome = pyscaffoldext.awesome.extension:AwesomeExtension

[test]
# py.test options when running `python setup.py test`
# addopts = --verbose
extras = True

[tool:pytest]
# Options for py.test:
# Specify command line options as you would do when invoking py.test directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
addopts =
    --cov nexusLIMS --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# Use pytest markers to select/deselect specific tests
# markers =
#     slow: mark tests as slow (deselect with '-m "not slow"')

[aliases]
dists = bdist_wheel

[bdist_wheel]
# Use this option if your package is pure-python
universal = 1

[build_sphinx]
source_dir = docs
build_dir = build/sphinx

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no-vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max-line-length = 88
extend-ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py

[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
version = 3.3.1
package = nexusLIMS
